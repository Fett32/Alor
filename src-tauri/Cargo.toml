[package]
name = "alor"
version = "0.1.0"
description = "Alor — multi-agent orchestrator backend"
authors = ["Fett"]
edition = "2021"

[lib]
name = "alor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "alor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
portable-pty = "0.9"
serde_yaml = "0.9"

[dev-dependencies]
# Used by memory_get handler tests (audit 8b03cae6 fix #5) to build
# disposable hub fixtures under XDG_DATA_HOME. Serialized via a
# module-level Mutex so concurrent tests don't race on the env var.
tempfile = "3"

# [profile.release] lives at the workspace root (/Cargo.toml) — cargo
# ignores profile blocks on non-root workspace members and emits
# "profiles for the non root package will be ignored" if one is
# defined here. Keeping this comment so the next contributor who
# wants to tweak LTO / strip / opt-level knows where to actually
# make the change, and doesn't silently re-introduce a no-op block.
