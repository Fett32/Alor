name: python-tests

on:
  push:
    branches: [main, dev]
    paths:
      - "orchestrator-py/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "orchestrator-py/**"
      - ".github/workflows/python-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: orchestrator-py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: orchestrator-py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r orchestrator-py/requirements.txt

      - name: Run test scripts
        # PYTHON=python tells run_tests.sh to reuse the setup-python interpreter
        # (which already has requirements.txt installed above) instead of
        # provisioning its own .venv.
        env:
          PYTHON: python
        run: ./orchestrator-py/run_tests.sh
