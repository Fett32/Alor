<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">

      <!-- ── Header ───────────────────────────────────────────────────── -->
      <header id="header">
        <span class="logo">ALOR</span>
        <span class="session-meta" id="session-meta">—</span>
        <input id="spawn-workspace"
               class="hdr-input"
               type="text"
               placeholder="Spawn ws"
               title="Sway workspace to spawn Alor on; takes effect next launch. Empty = current workspace." />
        <button id="btn-balance" class="btn-header" title="Re-tile alor-main panes evenly">Balance</button>
        <button id="btn-kill-all" class="btn-header-danger" title="Kill all background sessions">Kill All Sessions</button>
      </header>

      <!-- ── Sidebar: agents + tasks ─────────────────────────────────── -->
      <aside id="sidebar">
        <!-- Agents section -->
        <div class="panel-header">
          <span>Agents</span>
          <button id="btn-show-register">+</button>
        </div>
        <div id="agent-list">
          <p class="agent-empty">No agents registered.</p>
        </div>
        <form id="register-form" class="hidden" autocomplete="off">
          <input id="reg-id"      type="text" placeholder="Agent (claude, gemini...)" required />
          <input id="reg-name"    type="text" placeholder="Role (impl, review...)"   required />
          <button type="submit">Spawn Session</button>
        </form>

        <!-- Tasks section -->
        <div class="panel-header task-header">
          <span>Tasks</span>
          <button id="btn-new-task">+</button>
        </div>
        <div id="task-controls">
          <input id="task-search" type="search" placeholder="Filter…" />
          <select id="task-filter-state">
            <option value="">All</option>
            <option value="ASSIGNED">Assigned</option>
            <option value="ACCEPTED">Accepted</option>
            <option value="COMPLETED">Completed</option>
            <option value="BLOCKED">Blocked</option>
            <option value="CANCELLED">Cancelled</option>
            <option value="STALE">Stale</option>
          </select>
        </div>
        <div id="task-list-scroll">
          <!-- TaskList renders here -->
        </div>
      </aside>

      <!-- ── Terminal: single xterm.js showing alor-main ──────────── -->
      <section id="terminal-panel">
        <div id="terminal-container">
          <!-- single xterm.js instance -->
        </div>
      </section>

    </div><!-- #app -->

    <!-- ── New-task modal ────────────────────────────────────────────── -->
    <div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="task-modal">
        <h2 id="modal-title">New Task</h2>
        <label>
          Title
          <input id="modal-title-input" type="text" placeholder="Short task title" required />
        </label>
        <label>
          Description
          <textarea id="modal-desc-input" rows="3" placeholder="What should the agent do?"></textarea>
        </label>
        <label>
          Assign to agent
          <select id="modal-agent-select">
            <option value="">— unassigned —</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-cancel-modal" id="btn-close-modal">Cancel</button>
          <button type="button" class="btn-submit"       id="btn-submit-task">Create</button>
        </div>
      </div>
    </div>

    <!-- ── Proposal Review modal ────────────────────────────────────── -->
    <div id="proposal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
      <div id="proposal-modal">
        <h2 id="proposal-title">Review Proposal</h2>
        
        <div class="proposal-section">
          <h3>Logic Brief</h3>
          <div id="proposal-brief" class="code-font"></div>
        </div>

        <div class="proposal-section">
          <h3>Proposed Diff</h3>
          <pre id="proposal-diff" class="code-font"></pre>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel-modal" id="btn-close-proposal">Close</button>
          <button type="button" class="btn-submit"       id="btn-approve-task">Approve & Apply</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
