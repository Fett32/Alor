[project]
name = "vaelkor"
version = "0.1.0"
description = "Multi-agent orchestration workspace"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pyte>=0.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
vaelkor = "vaelkor.main:main"
vaelkor-wrapper = "vaelkor.wrapper.cli:main"
vaelkor-daemon = "vaelkor.daemon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vaelkor"]

[tool.ruff]
line-length = 100
